<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>Dasolabs NEURONET — Industrial Living Twin</title>
<style>
  :root {
    --bg: #040812;
    --bg2: #091429;
    --ink: #eaf3ff;
    --mute: #7a97b8;
    --cyan: #4bc8ff;
    --cyan2: #8be0ff;
    --green: #4bffaa;
    --purple: #c488ff;
    --red: #ff5566;
    --amber: #ffb94a;
    --border: rgba(75, 200, 255, 0.22);
    --panel: rgba(6, 14, 32, 0.82);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", sans-serif; color: var(--ink); height: 100%; width: 100%; -webkit-user-select: none; user-select: none; }
  #scene3d { position: fixed; inset: 0; display: block; z-index: 1; }

  /* ─── Logo + brand ─── */
  .brand {
    position: fixed; top: 20px; left: 24px; z-index: 20; display: flex; align-items: center; gap: 10px; pointer-events: none;
  }
  .brand .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--cyan) 0%, #ffffff 100%);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    box-shadow: 0 0 20px rgba(75, 200, 255, 0.5);
  }
  .brand .name { font-size: 18px; letter-spacing: 0.3em; font-weight: 600; }
  .brand .name b { color: var(--cyan); font-weight: 700; }
  .brand .sub { font-size: 9px; color: var(--cyan); letter-spacing: 0.4em; margin-top: 2px; }

  /* ─── HUD : top-right modes ─── */
  .modes {
    position: fixed; top: 20px; right: 24px; z-index: 20;
    display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px; backdrop-filter: blur(14px);
  }
  .modes button {
    background: transparent; border: 0; color: var(--mute);
    padding: 7px 12px; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; cursor: pointer; border-radius: 5px; font-weight: 600;
  }
  .modes button:hover { color: var(--ink); }
  .modes button.on { background: var(--cyan); color: #061024; }

  /* ─── Layer stack indicator (left side) ─── */
  .stack {
    position: fixed; top: 50%; left: 24px; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px; z-index: 15;
  }
  .stack .layer {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid transparent;
    padding: 10px 14px; border-radius: 6px; backdrop-filter: blur(10px); min-width: 220px;
    transition: all 0.25s ease;
    cursor: pointer;
  }
  .stack .layer:hover { border-left-color: var(--cyan); transform: translateX(4px); }
  .stack .layer.active { border-left-color: var(--cyan); box-shadow: 0 0 24px rgba(75, 200, 255, 0.25); }
  .stack .layer .dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--mute);
  }
  .stack .layer.pulse .dot { animation: pulse 1s infinite; box-shadow: 0 0 10px currentColor; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .stack .layer .meta { display: flex; flex-direction: column; }
  .stack .layer .lbl { font-size: 9px; letter-spacing: 0.3em; color: var(--mute); text-transform: uppercase; }
  .stack .layer .name { font-size: 13px; font-weight: 600; color: var(--ink); }
  .stack .layer .val { margin-left: auto; font-size: 11px; color: var(--cyan); font-family: "SF Mono", monospace; }

  /* ─── Machine panel (right side) ─── */
  .machinePanel {
    position: fixed; top: 50%; right: 24px; transform: translateY(-50%);
    width: 340px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px;
    z-index: 15; backdrop-filter: blur(14px);
    display: none;
  }
  .machinePanel.on { display: block; }
  .machinePanel h3 { margin: 0 0 4px; font-size: 15px; letter-spacing: 0.1em; font-weight: 600; }
  .machinePanel .mid { font-size: 10px; color: var(--mute); letter-spacing: 0.3em; margin-bottom: 14px; text-transform: uppercase; }
  .machinePanel .row { margin-bottom: 14px; }
  .machinePanel .row label { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.25em; color: var(--mute); text-transform: uppercase; margin-bottom: 6px; }
  .machinePanel .row label span.val { color: var(--cyan); font-family: "SF Mono", monospace; letter-spacing: 0; font-size: 12px; font-weight: 600; }
  .machinePanel input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: rgba(75, 200, 255, 0.15); border-radius: 2px; outline: none; }
  .machinePanel input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--cyan); cursor: pointer; box-shadow: 0 0 10px rgba(75, 200, 255, 0.5); }
  .machinePanel .toggles { display: flex; gap: 8px; margin-top: 16px; }
  .machinePanel .toggles button { flex: 1; background: rgba(75, 200, 255, 0.08); border: 1px solid var(--border); color: var(--ink); padding: 8px; border-radius: 6px; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; }
  .machinePanel .toggles button.danger { color: var(--red); border-color: rgba(255, 85, 102, 0.4); }
  .machinePanel .toggles button:hover { background: rgba(75, 200, 255, 0.15); }
  .machinePanel .status { margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 11px; letter-spacing: 0.1em; background: rgba(75, 255, 170, 0.08); color: var(--green); border: 1px solid rgba(75, 255, 170, 0.3); text-align: center; }
  .machinePanel .status.alarm { background: rgba(255, 85, 102, 0.08); color: var(--red); border-color: rgba(255, 85, 102, 0.4); }
  .machinePanel .close { position: absolute; top: 10px; right: 12px; background: transparent; border: 0; color: var(--mute); font-size: 20px; cursor: pointer; }

  /* ─── UNS payload panel (bottom center, expert mode) ─── */
  .unsPanel {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    width: min(680px, 90vw); background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; z-index: 15; backdrop-filter: blur(14px);
    display: none;
    font-family: "SF Mono", monospace; font-size: 11px;
    max-height: 32vh; overflow-y: auto;
  }
  .unsPanel.on { display: block; }
  .unsPanel .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-family: inherit; letter-spacing: 0.3em; font-size: 10px; color: var(--cyan); text-transform: uppercase; }
  .unsPanel .msg { padding: 6px 0; border-bottom: 1px solid rgba(75, 200, 255, 0.08); }
  .unsPanel .msg .topic { color: var(--cyan2); font-weight: 600; }
  .unsPanel .msg .payload { color: var(--mute); margin-top: 2px; }
  .unsPanel .msg .k { color: var(--purple); }
  .unsPanel .msg .s { color: var(--cyan2); }
  .unsPanel .msg .n { color: var(--amber); }
  .unsPanel .msg .ts { color: var(--mute); font-size: 10px; }

  /* ─── Mode guided scenario panel (bottom-left) ─── */
  .scenarioPanel {
    position: fixed; bottom: 24px; left: 24px;
    width: 320px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px;
    z-index: 15; backdrop-filter: blur(14px);
    display: none;
  }
  .scenarioPanel.on { display: block; }
  .scenarioPanel .lbl { font-size: 10px; color: var(--cyan); letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 10px; }
  .scenarioPanel button {
    display: block; width: 100%; margin-bottom: 8px; text-align: left;
    background: rgba(75, 200, 255, 0.08); border: 1px solid var(--border); color: var(--ink);
    padding: 12px 14px; border-radius: 6px; font-size: 12px; letter-spacing: 0.05em; cursor: pointer;
    transition: all 0.2s;
  }
  .scenarioPanel button:hover { background: rgba(75, 200, 255, 0.15); border-color: var(--cyan); transform: translateX(2px); }
  .scenarioPanel button .desc { display: block; font-size: 10px; color: var(--mute); margin-top: 3px; }

  /* ─── Toast ─── */
  .toasts { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .toast {
    padding: 10px 18px; border-radius: 24px; background: var(--panel); border: 1px solid var(--border);
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600; color: var(--cyan);
    backdrop-filter: blur(10px); animation: toastIn 0.3s ease;
  }
  .toast.alarm { color: var(--red); border-color: rgba(255, 85, 102, 0.5); }
  .toast.ok { color: var(--green); border-color: rgba(75, 255, 170, 0.4); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  /* ─── Attract overlay ─── */
  .attract {
    position: fixed; inset: 0; z-index: 25; pointer-events: none;
    background: radial-gradient(circle at center, transparent 20%, rgba(4, 8, 18, 0.6) 70%);
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10vh;
    opacity: 0; transition: opacity 0.6s;
  }
  .attract.on { opacity: 1; }
  .attract .cta {
    text-align: center;
    font-size: clamp(16px, 2.5vw, 28px); letter-spacing: 0.25em; text-transform: uppercase; font-weight: 300;
    color: var(--cyan); text-shadow: 0 0 30px rgba(75, 200, 255, 0.6);
    animation: breath 2.5s ease-in-out infinite;
  }
  @keyframes breath { 50% { opacity: 0.5; } }
  .attract .cta b { color: #fff; font-weight: 600; }
  .attract .sub { font-size: 11px; letter-spacing: 0.4em; color: var(--mute); margin-top: 12px; }

  /* ─── Instruction hint ─── */
  .hint {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 10; pointer-events: none;
    font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--mute);
    opacity: 0; transition: opacity 0.6s;
  }
  .hint.on { opacity: 1; }

  /* ─── Reset button ─── */
  .resetBtn {
    position: fixed; bottom: 24px; right: 24px; z-index: 20;
    background: var(--panel); border: 1px solid var(--border); color: var(--mute);
    padding: 10px 16px; border-radius: 6px; font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(10px);
  }
  .resetBtn:hover { color: var(--ink); border-color: var(--cyan); }
</style>
</head>
<body>

<canvas id="scene3d"></canvas>

<div class="brand">
  <div class="logo"></div>
  <div>
    <div class="name">DASO<b>LABS</b></div>
    <div class="sub">NEURONET · LIVING TWIN</div>
  </div>
</div>

<div class="modes" id="modes">
  <button data-mode="attract">Attract</button>
  <button data-mode="interactive" class="on">Interactive</button>
  <button data-mode="guided">Guided</button>
  <button data-mode="expert">Expert</button>
</div>

<div class="hint" id="hint">Click a machine to enter its data lifecycle</div>

<div class="stack" id="stack"></div>

<div class="machinePanel" id="machinePanel">
  <button class="close" id="closeMachine">×</button>
  <h3 id="mpTitle">—</h3>
  <div class="mid" id="mpLoc">—</div>
  <div class="row">
    <label>Temperature <span class="val" id="valTemp">0 °C</span></label>
    <input type="range" id="ctlTemp" min="20" max="140" step="0.1" value="72.5">
  </div>
  <div class="row">
    <label>Pressure <span class="val" id="valPressure">0 bar</span></label>
    <input type="range" id="ctlPressure" min="0" max="8" step="0.01" value="2.4">
  </div>
  <div class="row">
    <label>Flow <span class="val" id="valFlow">0 L/min</span></label>
    <input type="range" id="ctlFlow" min="0" max="300" step="1" value="120">
  </div>
  <div class="toggles">
    <button id="btnFault" class="danger">Trigger fault</button>
    <button id="btnCut">Cut OPC UA link</button>
  </div>
  <div class="status" id="mpStatus">Running · all channels nominal</div>
</div>

<div class="scenarioPanel" id="scenarioPanel">
  <div class="lbl">Guided scenarios</div>
  <button data-scenario="normal">
    Normal production
    <span class="desc">All channels nominal — baseline behavior</span>
  </button>
  <button data-scenario="overheat">
    Over-temperature event
    <span class="desc">Reactor temperature exceeds setpoint — alarm propagation</span>
  </button>
  <button data-scenario="opccut">
    OPC UA link cut
    <span class="desc">PLC loses SCADA — UNS keeps serving MES / ERP</span>
  </button>
  <button data-scenario="batch">
    Batch completion → ERP
    <span class="desc">Finished batch message traverses MES to ERP</span>
  </button>
</div>

<div class="unsPanel" id="unsPanel">
  <div class="head">
    <span>UNS Broker · Live Topics</span>
    <span id="unsRate">0 msg/s</span>
  </div>
  <div id="unsMsgs"></div>
</div>

<div class="toasts" id="toasts"></div>

<div class="attract" id="attract">
  <div>
    <div class="cta"><b>Touch</b> any machine</div>
    <div class="sub">Dasolabs industrial living twin · Neuronet v1.0</div>
  </div>
</div>

<button class="resetBtn" id="resetBtn">Reset ↻</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
"use strict";

const THREE = window.THREE;
if (!THREE) { alert("Three.js failed to load. Check your internet connection."); return; }

// ═══════════════════════════════════════════════════════════════════════
// 1. SIMULATION ENGINE (pub/sub store)
// ═══════════════════════════════════════════════════════════════════════

const Sim = (function () {
  const state = {
    machines: {}, // id -> { temp, pressure, flow, fault, opcCut, status, name, loc }
    scadaValues: {},   // snapshot visible côté SCADA (peut être stale si OPC cut)
    highbyteStore: {}, // snapshot contexte enrichi
    unsMessages: [],   // messages MQTT publiés
    subscribers: {
      MES:       { connected: true,  topics: ["dasolabs/+/+/+/temperature","dasolabs/+/+/+/batch"] },
      ERP:       { connected: true,  topics: ["dasolabs/+/+/+/batch"] },
      BI:        { connected: true,  topics: ["dasolabs/+/+/+/+"] },
      AI:        { connected: true,  topics: ["dasolabs/+/+/+/temperature"] },
      CLOUD:     { connected: true,  topics: ["dasolabs/+/+/+/+"] },
      ANALYTICS: { connected: true,  topics: ["dasolabs/+/+/+/temperature"] }
    },
    counters: { msgsPerSec: 0, lastSec: 0, msgsThisSec: 0 }
  };
  const listeners = new Set();

  function emit() {
    listeners.forEach(fn => { try { fn(state); } catch (e) { console.error(e); } });
  }
  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }

  function registerMachine(def) {
    state.machines[def.id] = Object.assign({
      temp: 72.5, pressure: 2.4, flow: 120,
      fault: false, opcCut: false,
      status: "OK",
      setpointTemp: 75, alarmTemp: 95
    }, def);
    state.scadaValues[def.id] = { temp: 72.5, pressure: 2.4, flow: 120, lastUpdate: Date.now() };
    state.highbyteStore[def.id] = { temp: 72.5, pressure: 2.4, flow: 120, context: makeContext(def) };
  }
  function makeContext(def) {
    return {
      site: def.site || "SITE-A",
      line: def.line || "LINE-01",
      machineId: def.id,
      machineName: def.name,
      zone: def.zone || "ZONE-A"
    };
  }

  function setMachineValue(id, field, value) {
    const m = state.machines[id];
    if (!m) return;
    m[field] = value;
    // réévalue status
    if (m.temp > m.alarmTemp) m.status = "ALARM";
    else if (m.fault) m.status = "FAULT";
    else m.status = "OK";
    emit();
  }
  function setMachineFault(id, fault) {
    const m = state.machines[id];
    if (!m) return;
    m.fault = fault;
    m.status = fault ? "FAULT" : (m.temp > m.alarmTemp ? "ALARM" : "OK");
    emit();
  }
  function setOpcCut(id, cut) {
    const m = state.machines[id];
    if (!m) return;
    m.opcCut = cut;
    emit();
  }
  function setSubscriberConnected(name, connected) {
    if (state.subscribers[name]) {
      state.subscribers[name].connected = connected;
      emit();
    }
  }

  // ─── Simulation ticks ────────────────────────────────────────────────
  // PLC scan = 100ms, SCADA refresh = 500ms, HighByte transform = 300ms, UNS pub = aligned with HB
  let lastPlcTick = 0, lastScadaTick = 0, lastHbTick = 0;
  function tick(now) {
    // PLC — scan interne, pas de visuel direct ici mais nécessaire au reste
    if (now - lastPlcTick > 100) {
      lastPlcTick = now;
    }
    // SCADA refresh (si OPC pas coupé)
    if (now - lastScadaTick > 500) {
      lastScadaTick = now;
      for (const id in state.machines) {
        const m = state.machines[id];
        if (!m.opcCut) {
          state.scadaValues[id] = { temp: m.temp, pressure: m.pressure, flow: m.flow, lastUpdate: now };
        }
      }
    }
    // HighByte transform + MQTT publish (indépendant du SCADA — direct au PLC)
    if (now - lastHbTick > 300) {
      lastHbTick = now;
      for (const id in state.machines) {
        const m = state.machines[id];
        // HighByte lit directement du PLC via OPC UA — pas affecté par le SCADA
        // Mais si on simule un cut OPC UA au niveau machine, HB aussi est down
        if (!m.opcCut) {
          state.highbyteStore[id] = { temp: m.temp, pressure: m.pressure, flow: m.flow, context: makeContext(m) };
          // Publie MQTT
          publishMqtt(id, "temperature", m.temp, "°C");
          if (Math.random() < 0.4) publishMqtt(id, "pressure", m.pressure, "bar");
          if (Math.random() < 0.4) publishMqtt(id, "flow", m.flow, "L/min");
          // Alarme ?
          if (m.temp > m.alarmTemp && Math.random() < 0.3) {
            publishMqtt(id, "alarm", "HIGH_TEMPERATURE", "");
          }
        }
      }
    }
    // Counter
    const sec = Math.floor(now / 1000);
    if (sec !== state.counters.lastSec) {
      state.counters.msgsPerSec = state.counters.msgsThisSec;
      state.counters.msgsThisSec = 0;
      state.counters.lastSec = sec;
    }
  }

  function publishMqtt(machineId, metric, value, unit) {
    const m = state.machines[machineId];
    if (!m) return;
    const topic = `dasolabs/${m.site}/${m.line}/${m.id}/${metric}`;
    const payload = {
      value, unit,
      ts: new Date().toISOString(),
      machine: m.name,
      line: m.line,
      site: m.site,
      quality: m.fault ? "BAD" : "GOOD"
    };
    state.unsMessages.unshift({ topic, payload, ts: Date.now() });
    if (state.unsMessages.length > 60) state.unsMessages.pop();
    state.counters.msgsThisSec++;
    // notification visuelle particule (voir layer 3D)
    if (visualFx) visualFx.spawnMqttParticle(machineId, metric);
    emit();
  }

  return {
    state, subscribe, emit,
    registerMachine, setMachineValue, setMachineFault, setOpcCut, setSubscriberConnected,
    tick, publishMqtt
  };
})();

let visualFx = null;

// ═══════════════════════════════════════════════════════════════════════
// 2. 3D SCENE
// ═══════════════════════════════════════════════════════════════════════

const canvas = document.getElementById("scene3d");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x040812, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x040812, 0.015);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(45, 32, 55);
camera.lookAt(0, 5, 0);

scene.add(new THREE.AmbientLight(0x2a4466, 0.7));
const sun = new THREE.DirectionalLight(0xaad4ff, 1.1);
sun.position.set(20, 40, 10);
scene.add(sun);
const rim = new THREE.PointLight(0x4bc8ff, 1.5, 60);
rim.position.set(-20, 15, 20);
scene.add(rim);

// ─── Factory floor ─────────────────────────────────────────────────────
const floorGeo = new THREE.PlaneGeometry(80, 80, 40, 40);
const floor = new THREE.Mesh(floorGeo, new THREE.MeshBasicMaterial({ color: 0x0e1e38, wireframe: true, transparent: true, opacity: 0.3 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
scene.add(floor);
const floorSolid = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshBasicMaterial({ color: 0x061024 }));
floorSolid.rotation.x = -Math.PI / 2;
floorSolid.position.y = -0.01;
scene.add(floorSolid);

// Grid floor glow lines
const gridHelper = new THREE.GridHelper(80, 20, 0x4bc8ff, 0x1a3a6a);
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.25;
scene.add(gridHelper);

// Rings (soft decorative)
for (let i = 0; i < 3; i++) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(28 + i * 4, 0.08, 8, 100),
    new THREE.MeshBasicMaterial({ color: 0x4bc8ff, transparent: true, opacity: 0.15 - i * 0.03 })
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 0.05;
  scene.add(ring);
}

// ─── Machines (clickable) ──────────────────────────────────────────────
const MACHINES = [
  { id: "REACT-01", name: "Reactor",     site: "SITE-A", line: "LINE-01", zone: "ZONE-A", pos: [-15, 0, -8], color: 0x4bc8ff, shape: "reactor" },
  { id: "MIX-02",   name: "Mixer",       site: "SITE-A", line: "LINE-01", zone: "ZONE-A", pos: [  0, 0, -14], color: 0x4bffaa, shape: "mixer" },
  { id: "FILL-03",  name: "Filler",      site: "SITE-A", line: "LINE-01", zone: "ZONE-B", pos: [ 14, 0, -6], color: 0xffb94a, shape: "filler" },
  { id: "ROBOT-04", name: "Robot arm",   site: "SITE-A", line: "LINE-02", zone: "ZONE-B", pos: [ 16, 0,  10], color: 0xc488ff, shape: "robot" },

function buildMachine(def) {
  const group = new THREE.Group();
  group.userData.machineId = def.id;
  group.position.set(...def.pos);

  let body;
  const bodyMat = new THREE.MeshPhongMaterial({ color: 0x1a3058, specular: 0x4bc8ff, shininess: 60, emissive: 0x061024, emissiveIntensity: 0.3 });
  const edgeMat = new THREE.LineBasicMaterial({ color: def.color, transparent: true, opacity: 0.85 });

  if (def.shape === "reactor") {
    body = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.5, 5, 24), bodyMat);
    body.position.y = 2.5;
    group.add(body);
    const topDome = new THREE.Mesh(new THREE.SphereGeometry(2.2, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), bodyMat);
    topDome.position.y = 5;
    group.add(topDome);
    group.add(new THREE.LineSegments(new THREE.EdgesGeometry(body.geometry), edgeMat));
  } else if (def.shape === "mixer") {
    body = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4), bodyMat);
    body.position.y = 2;
    group.add(body);
    const paddle = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3, 0.3), new THREE.MeshBasicMaterial({ color: def.color }));
    paddle.position.y = 2;
    group.add(paddle);
    group.userData.paddle = paddle;
    group.add(new THREE.LineSegments(new THREE.EdgesGeometry(body.geometry), edgeMat));
  } else if (def.shape === "filler") {
    body = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2, 4, 20), bodyMat);
    body.position.y = 2;
    group.add(body);
    for (let i = 0; i < 4; i++) {
      const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.3, 1.2, 8), new THREE.MeshBasicMaterial({ color: def.color }));
      const ang = (i / 4) * Math.PI * 2;
      nozzle.position.set(Math.cos(ang) * 1.3, 0.6, Math.sin(ang) * 1.3);
      group.add(nozzle);
    }
    group.add(new THREE.LineSegments(new THREE.EdgesGeometry(body.geometry), edgeMat));
  } else if (def.shape === "robot") {
    const base = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.6, 1.2, 16), bodyMat);
    base.position.y = 0.6;
    group.add(base);
    const arm1 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3, 0.6), bodyMat);
    arm1.position.y = 2.7;
    group.add(arm1);
    const arm2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2.5, 0.5), bodyMat);
    arm2.position.set(0.6, 4.5, 0);
    arm2.rotation.z = -0.6;
    group.add(arm2);
    group.userData.arm2 = arm2;
    const gripper = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 0.8), new THREE.MeshBasicMaterial({ color: def.color }));
    gripper.position.set(1.6, 5.5, 0);
    group.add(gripper);
    body = base;
  } else if (def.shape === "amr") {
    body = new THREE.Mesh(new THREE.BoxGeometry(4, 1, 2.8), bodyMat);
    body.position.y = 0.6;
    group.add(body);
    const top = new THREE.Mesh(new THREE.BoxGeometry(3, 0.4, 2.2), new THREE.MeshBasicMaterial({ color: def.color }));
    top.position.y = 1.3;
    group.add(top);
    for (let i = 0; i < 4; i++) {
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.4, 12), new THREE.MeshBasicMaterial({ color: 0x111 }));
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set((i < 2 ? -1.5 : 1.5), 0.3, (i % 2 === 0 ? -1 : 1));
      group.add(wheel);
    }
    group.add(new THREE.LineSegments(new THREE.EdgesGeometry(body.geometry), edgeMat));
    group.userData.amr = true;
    group.userData.amrAngle = Math.random() * Math.PI * 2;
  } else if (def.shape === "packager") {
    body = new THREE.Mesh(new THREE.BoxGeometry(5, 2, 3), bodyMat);
    body.position.y = 1;
    group.add(body);
    const belt = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.1, 2), new THREE.MeshBasicMaterial({ color: def.color, transparent: true, opacity: 0.6 }));
    belt.position.y = 2.1;
    group.add(belt);
    group.add(new THREE.LineSegments(new THREE.EdgesGeometry(body.geometry), edgeMat));
  }

  // Status light (change color per status)
  const lightMat = new THREE.MeshBasicMaterial({ color: 0x4bffaa });
  const statusLight = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), lightMat);
  statusLight.position.y = 7;
  group.add(statusLight);
  // Soft glow sphere around light
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x4bffaa, transparent: true, opacity: 0.2 });
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), glowMat);
  glow.position.y = 7;
  group.add(glow);

  // Ground pad (highlights when selected)
  const padMat = new THREE.MeshBasicMaterial({ color: def.color, transparent: true, opacity: 0.25 });
  const pad = new THREE.Mesh(new THREE.RingGeometry(3, 3.6, 32), padMat);
  pad.rotation.x = -Math.PI / 2;
  pad.position.y = 0.02;
  group.add(pad);

  // Label (sprite)
  const canvas2d = document.createElement("canvas");
  canvas2d.width = 256; canvas2d.height = 64;
  const ctx = canvas2d.getContext("2d");
  ctx.fillStyle = "rgba(10,25,50,0.75)";
  ctx.fillRect(0, 0, 256, 64);
  ctx.strokeStyle = "#4bc8ff"; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, 254, 62);
  ctx.fillStyle = "#eaf3ff";
  ctx.font = "bold 20px -apple-system, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(def.name.toUpperCase(), 128, 28);
  ctx.font = "11px -apple-system";
  ctx.fillStyle = "#4bc8ff";
  ctx.fillText(def.id, 128, 48);
  const tex = new THREE.CanvasTexture(canvas2d);
  const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  label.scale.set(5, 1.25, 1);
  label.position.y = 9;
  group.add(label);

  scene.add(group);
  machineObjects[def.id] = { group, body, statusLight, lightMat, glow, glowMat, pad, padMat };
  Sim.registerMachine(def);
}

// 3. VISUAL FX (data particles)
// ═══════════════════════════════════════════════════════════════════════

visualFx = (function () {
  const PARTICLES = [];
  const geom = new THREE.SphereGeometry(0.18, 8, 8);

  // Spawn a particle flying from machine → broker then to a random subscriber
  function spawnMqttParticle(machineId, metric) {
    const m = Sim.state.machines[machineId];
    if (!m || m.opcCut) return;
    const start = new THREE.Vector3(m.pos[0], 1, m.pos[2]);
    const mid = new THREE.Vector3(0, 15, 0);
    // Pick a connected subscriber at random weighted
    const candidates = Object.entries(Sim.state.subscribers).filter(([n, s]) => s.connected);
    if (candidates.length === 0) return;
    const picks = candidates.slice().sort(() => Math.random() - 0.5).slice(0, 1 + Math.floor(Math.random() * 2));
    picks.forEach(([name]) => {
      const subDef = SUBS_DEF.find(s => s.name === name);
      if (!subDef) return;
      const end = new THREE.Vector3(subDef.pos[0], subDef.pos[1], subDef.pos[2]);
      const color = metric === "alarm" ? 0xff5566 : subDef.color;
      const mat = new THREE.MeshBasicMaterial({ color });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.position.copy(start);
      scene.add(mesh);
      PARTICLES.push({ mesh, start, mid, end, phase: 0, speed: 0.015 + Math.random() * 0.01, metric });
    });
  }

  function update() {
    for (let i = PARTICLES.length - 1; i >= 0; i--) {
      const p = PARTICLES[i];
      p.phase += p.speed;
      let pos;
      if (p.phase < 0.5) {
        // start → mid (broker)
        const t = p.phase * 2;
        pos = new THREE.Vector3().lerpVectors(p.start, p.mid, easeInOut(t));
      } else if (p.phase < 1) {
        const t = (p.phase - 0.5) * 2;
        pos = new THREE.Vector3().lerpVectors(p.mid, p.end, easeInOut(t));
      } else {
        scene.remove(p.mesh);
        PARTICLES.splice(i, 1);
        continue;
      }
      p.mesh.position.copy(pos);
      // Scale pulse when at broker
      const scl = 1 + Math.abs(p.phase - 0.5) * 1.5;
      p.mesh.scale.set(scl, scl, scl);
    }
  }

  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  return { spawnMqttParticle, update };
})();

let attractInterval = null, attractStep = 0;
function startAttractLoop() {
  if (attractInterval) return;
  attractStep = 0;
  attractInterval = setInterval(() => {
    const machines = Object.keys(Sim.state.machines);
    const id = machines[attractStep % machines.length];
    // Spike temperature then relax
    const m = Sim.state.machines[id];
    const target = 70 + Math.random() * 30;
    animateValue(id, "temp", target, 1500);
    attractStep++;
    // Occasionally trigger a fault for drama
    if (attractStep % 5 === 0) {
      const id2 = machines[Math.floor(Math.random() * machines.length)];
      Sim.setMachineFault(id2, true);
      setTimeout(() => Sim.setMachineFault(id2, false), 2500);
    }
  }, 2200);
}
function stopAttractLoop() {
  if (attractInterval) { clearInterval(attractInterval); attractInterval = null; }
}
function animateValue(id, field, target, duration) {
  const m = Sim.state.machines[id];
  if (!m) return;
  const start = m[field];
  const t0 = performance.now();
  function step() {
    const t = (performance.now() - t0) / duration;
    if (t >= 1) { Sim.setMachineValue(id, field, target); return; }
    Sim.setMachineValue(id, field, start + (target - start) * (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2));
    requestAnimationFrame(step);
  }
  step();
}

// --- Guided scenarios
document.querySelectorAll("#scenarioPanel button").forEach((b) => {
  b.addEventListener("click", () => runScenario(b.dataset.scenario));
});
function runScenario(key) {
  // Reset first
  resetAll(false);
  if (key === "normal") {
    toast("Scenario · Normal production", "ok");
  } else if (key === "overheat") {
    toast("Scenario · Over-temperature event starting", "alarm");
    const id = "REACT-01";
    openMachine(id);
    animateValue(id, "temp", 110, 3000);
    setTimeout(() => toast("ALARM · broker publishes HIGH_TEMPERATURE · AI subscribed", "alarm"), 3200);
    setTimeout(() => animateValue(id, "temp", 72, 2000), 6000);
  } else if (key === "opccut") {
    toast("Scenario · Cutting OPC UA link", "alarm");
    const id = "MIX-02";
    openMachine(id);
    setTimeout(() => Sim.setOpcCut(id, true), 1500);
    setTimeout(() => toast("SCADA goes stale · MES / ERP still fed via other machines", ""), 2500);
    setTimeout(() => Sim.setOpcCut(id, false), 8000);
    setTimeout(() => toast("Link restored", "ok"), 8200);
  } else if (key === "batch") {
    toast("Scenario · Batch finishing on FILL-03", "ok");
    openMachine("FILL-03");
    setTimeout(() => Sim.publishMqtt("FILL-03", "batch", "BATCH-20261028-0012", "id"), 1500);
    setTimeout(() => toast("Batch message routed · MES notified · ERP invoice created", "ok"), 3200);
  }
}

// --- Reset
document.getElementById("resetBtn").addEventListener("click", () => resetAll(true));
function resetAll(withToast) {
  Object.keys(Sim.state.machines).forEach(id => {
    Sim.setMachineValue(id, "temp", 72.5 + (Math.random() - 0.5) * 4);
    Sim.setMachineValue(id, "pressure", 2.4 + (Math.random() - 0.5) * 0.3);
    Sim.setMachineValue(id, "flow", 120 + (Math.random() - 0.5) * 20);
    Sim.setMachineFault(id, false);
    Sim.setOpcCut(id, false);
  });
  Sim.state.unsMessages.length = 0;
  closeMachine();
  if (withToast) toast("System reset", "ok");
}

// ═══════════════════════════════════════════════════════════════════════
// 5. CAMERA + INTERACTION
// ═══════════════════════════════════════════════════════════════════════

const camTarget = new THREE.Vector3(0, 5, 0);
const camPos = new THREE.Vector3(45, 32, 55);
let camPosTarget = camPos.clone();
let camLookTarget = camTarget.clone();

function cameraFlyTo(x, y, z, lookX = 0, lookY = 5, lookZ = 0) {
  camPosTarget.set(x, y, z);
  camLookTarget.set(lookX, lookY, lookZ);
}

// Mouse / touch interaction
let dragging = false, pX = 0, pY = 0, orbitAzim = Math.PI * 0.3, orbitElev = Math.PI * 0.35, orbitDist = 70;
function updateOrbitCam() {
  const x = Math.cos(orbitAzim) * Math.cos(orbitElev) * orbitDist;
  const z = Math.sin(orbitAzim) * Math.cos(orbitElev) * orbitDist;
  const y = Math.sin(orbitElev) * orbitDist;
  camPosTarget.set(x, y, z);
  camLookTarget.set(0, 5, 0);
}
updateOrbitCam();

canvas.addEventListener("pointerdown", (e) => {
  if (e.target !== canvas) return;
  dragging = true; pX = e.clientX; pY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - pX, dy = e.clientY - pY;
  pX = e.clientX; pY = e.clientY;
  if (!currentMachineId) {
    orbitAzim -= dx * 0.004;
    orbitElev = Math.max(0.15, Math.min(1.3, orbitElev + dy * 0.004));
    updateOrbitCam();
  }
});
canvas.addEventListener("pointerup", (e) => { dragging = false; });
canvas.addEventListener("wheel", (e) => {
  if (currentMachineId) return;
  orbitDist = Math.max(30, Math.min(120, orbitDist + e.deltaY * 0.05));
  updateOrbitCam();
}, { passive: true });

// Click to open machine
canvas.addEventListener("click", (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const groups = Object.values(machineObjects).map(o => o.group);
  const hits = raycaster.intersectObjects(groups, true);
  if (hits.length) {
    let g = hits[0].object;
    while (g && !g.userData.machineId) g = g.parent;
    if (g && g.userData.machineId) openMachine(g.userData.machineId);
  }
});

// Idle → attract
let lastActivity = Date.now();
function markActivity() { lastActivity = Date.now(); if (currentMode === "attract") setMode("interactive"); }
["pointerdown", "pointermove", "wheel", "touchstart"].forEach(ev => window.addEventListener(ev, markActivity));
setInterval(() => {
  if (Date.now() - lastActivity > 25000 && currentMode === "interactive" && !currentMachineId) {
    setMode("attract");
  }
}, 1000);

// ═══════════════════════════════════════════════════════════════════════
// 6. ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════════════

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const now = performance.now();

  Sim.tick(now);
  visualFx.update();

  // Smooth cam
  camera.position.lerp(camPosTarget, 0.04);
  // Keep lookAt smoothly
  const look = new THREE.Vector3().copy(camLookTarget);
  camera.lookAt(look);

  // Machine animations + status lights
  MACHINES.forEach((def) => {
    const o = machineObjects[def.id];
    const m = Sim.state.machines[def.id];
    if (!o || !m) return;
    // Mixer paddle spin
    if (o.group.userData.paddle) o.group.userData.paddle.rotation.y += 0.1 * (m.flow / 150);
    // Robot arm
    if (o.group.userData.arm2) o.group.userData.arm2.rotation.z = -0.6 + Math.sin(now * 0.002) * 0.4;
    // AMR moves in a circle
    if (o.group.userData.amr) {
      o.group.userData.amrAngle += 0.004;
      o.group.position.x = def.pos[0] + Math.cos(o.group.userData.amrAngle) * 3;
      o.group.position.z = def.pos[2] + Math.sin(o.group.userData.amrAngle) * 3;
      o.group.rotation.y = -o.group.userData.amrAngle - Math.PI / 2;
    }
    // Status light color
    const c = m.status === "ALARM" ? 0xff5566 : m.status === "FAULT" ? 0xffb94a : m.opcCut ? 0xaaaaaa : 0x4bffaa;
    o.lightMat.color.setHex(c);
    o.glowMat.color.setHex(c);
    // Pulse glow
    const scl = 1 + Math.sin(now * 0.005) * 0.2;
    o.glow.scale.set(scl, scl, scl);
    // Opacity line to broker : stronger when publishing
    machineToBrokerLines[def.id].material.opacity = m.opcCut ? 0.04 : 0.18 + Math.sin(now * 0.002 + def.pos[0]) * 0.08;
  });

  // Broker rings
  brokerGroup.rotation.y += 0.003;
  brokerGroup.children.forEach((c) => {
    if (c.userData && c.userData.spin) { c.rotation.x += c.userData.spin; c.rotation.y += c.userData.spin; }
  });

  // Subscriber nodes rotation + line opacity based on connected
  SUBS_DEF.forEach((s) => {
    const o = subscriberObjects[s.name];
    const connected = Sim.state.subscribers[s.name].connected;
    o.group.rotation.y += 0.01;
    o.line.material.opacity = connected ? (0.3 + Math.sin(now * 0.003) * 0.1) : 0.05;
  });

  updateStack();
  updateUns();

  renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Boot : start attract after 2s if no activity
setTimeout(() => setMode("interactive"), 200);

})();
</script>
